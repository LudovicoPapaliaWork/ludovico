<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- Redirect istantaneo anche qui come fallback per URL non previsti -->
  <meta http-equiv="refresh" content="0;url=https://www.ludovicopapalia.com/">
  <link rel="canonical" href="https://www.ludovicopapalia.com/">
  <title>404 — Ludovico Papalia</title>

  <script src="/site-config.js"></script>

  <script>
    // Salva il path per eventuale debug futuro
    try { sessionStorage.setItem('lp_404_from', window.location.pathname); } catch(e) {}
    // Redirect immediato
    window.location.replace('https://www.ludovicopapalia.com/');
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ff-sans);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    a {
      color: var(--gold);
      font-size: .9rem;
      letter-spacing: .06em;
    }
  </style>
</head>
<body>
  <!-- Mostrato solo se JS è disabilitato o lentissimo -->
  <p>Reindirizzamento in corso… <a href="https://www.ludovicopapalia.com/">Clicca qui</a> se non vieni reindirizzato.</p>
</body>
</html>
