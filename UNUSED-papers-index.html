<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Publications — Ludovico Papalia</title>
  <meta name="description" content="Full list of academic publications, conference papers, book chapters and books by Ludovico Papalia — PhD Candidate in Legal Informatics at the University of Bologna.">
  <meta name="author" content="Ludovico Papalia">

  <link rel="canonical" href="https://www.ludovicopapalia.com/papers-index.html">

  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Publications — Ludovico Papalia">
  <meta property="og:description" content="Academic publications by Ludovico Papalia.">
  <meta property="og:url"         content="https://www.ludovicopapalia.com/papers-index.html">

  <!-- ► MASTER SITE CONFIG -->
  <script src="/site-config.js"></script>

  <style>
    /* ─── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ff-sans);
      font-size: 16px;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* ─── GRAIN ──────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9999;
      opacity: .025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px;
    }

    /* ─── PAGE WRAPPER ───────────────────────────────────────── */
    .page-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 8rem 2.5rem 6rem;
    }

    /* ─── HEADER ─────────────────────────────────────────────── */
    .page-eyebrow {
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      animation: fadeUp .7s ease both;
    }
    h1.page-title {
      font-family: var(--ff-serif);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 300;
      color: var(--accent);
      line-height: 1.1;
      letter-spacing: -.01em;
      animation: fadeUp .7s .07s ease both;
    }
    h1.page-title em { font-style: italic; color: var(--gold); }
    .page-lead {
      margin-top: 1rem;
      font-size: .95rem;
      color: var(--muted);
      max-width: 60ch;
      line-height: 1.8;
      animation: fadeUp .7s .14s ease both;
    }
    .page-divider {
      width: 40px; height: 1px;
      background: var(--gold-dim);
      margin: 2rem 0 2rem;
      animation: fadeUp .7s .2s ease both;
    }

    /* ─── SEARCH BAR ─────────────────────────────────────────── */
    .search-wrap {
      position: relative;
      margin-bottom: 1rem;
      animation: fadeUp .7s .22s ease both;
    }
    .search-icon {
      position: absolute;
      left: 1.1rem; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      display: flex; align-items: center;
    }
    .search-input {
      width: 100%;
      padding: .85rem 2.6rem .85rem 2.8rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--ff-sans);
      font-size: .88rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .search-input::placeholder { color: var(--muted); opacity: .7; }
    .search-input:focus { border-color: var(--gold-dim); }
    .search-clear {
      position: absolute;
      right: 1rem; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: none;
      padding: .2rem;
      font-size: .9rem;
      line-height: 1;
      transition: color .18s;
    }
    .search-clear:hover { color: var(--gold); }
    .search-clear.visible { display: block; }

    /* ─── RESULTS COUNT ──────────────────────────────────────── */
    .results-count {
      font-size: .75rem;
      color: var(--muted);
      letter-spacing: .04em;
      margin-bottom: 1.2rem;
      min-height: 1.2em;
      animation: fadeUp .7s .26s ease both;
    }

    /* ─── PUB LIST ───────────────────────────────────────────── */
    .pub-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .pub-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem 1.8rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1.5rem;
      transition: border-color .2s, transform .2s;
      position: relative;
      overflow: hidden;
    }
    .pub-item:hover {
      border-color: var(--gold-dim);
      transform: translateY(-2px);
    }
    .pub-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--gold-dim), transparent);
      opacity: 0;
      transition: opacity .2s;
    }
    .pub-item:hover::before { opacity: 1; }

    .pub-year-badge {
      font-size: .72rem;
      letter-spacing: .1em;
      color: var(--gold);
      background: rgba(138,98,32,.08);
      border: 1px solid rgba(138,98,32,.18);
      padding: .3rem .75rem;
      border-radius: 99px;
      white-space: nowrap;
      align-self: start;
      margin-top: .1rem;
    }

    .pub-body { min-width: 0; }
    .pub-title {
      font-family: var(--ff-serif);
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: .3rem;
      line-height: 1.3;
    }
    .pub-title mark,
    .pub-venue mark,
    .pub-desc mark {
      background: rgba(138,98,32,.15);
      color: var(--gold);
      border-radius: 2px;
      padding: 0 1px;
    }
    .pub-venue {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .3rem;
      line-height: 1.5;
    }
    .pub-desc {
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.65;
      opacity: .85;
    }

    .pub-type {
      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: .22rem .65rem;
      border-radius: 99px;
      white-space: nowrap;
      align-self: start;
      margin-top: .15rem;
    }

    /* ─── EMPTY STATE ────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: var(--muted);
      font-size: .9rem;
      display: none;
    }

    /* ─── FOOTER ─────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      max-width: 900px; margin: 0 auto;
      padding: 1.8rem 2.5rem 3rem;
      display: flex; align-items: center; justify-content: space-between;
      font-size: .75rem; color: var(--muted);
    }
    .footer-back { transition: color .2s; letter-spacing: .06em; }
    .footer-back:hover { color: var(--gold); }

    /* ─── ANIMATIONS ─────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */
    @media (max-width: 640px) {
      .page-wrapper { padding: 7rem 1.4rem 4rem; }
      .pub-item { grid-template-columns: auto 1fr; gap: 1rem; }
      .pub-type { display: none; }
      footer { flex-direction: column; gap: .4rem; text-align: center; padding: 1.5rem 1.4rem 2.5rem; }
    }
  </style>
</head>
<body>

<main>
  <div class="page-wrapper">

    <p class="page-eyebrow">Output</p>
    <h1 class="page-title">Publications &amp; <em>Talks</em></h1>
    <p class="page-lead">
      Academic papers, conference contributions, book chapters and monographs.
      All work sits at the intersection of law, distributed ledger technology, and digital governance.
    </p>
    <div class="page-divider"></div>

    <div class="search-wrap">
      <span class="search-icon">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="6.5" cy="6.5" r="5"/><path d="M10.5 10.5l3.5 3.5"/>
        </svg>
      </span>
      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Search by title, venue, keyword…"
        autocomplete="off"
        spellcheck="false"
      >
      <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
    </div>

    <div class="results-count" id="resultsCount"></div>
    <div class="pub-list" id="pubList"></div>
    <div class="empty-state" id="emptyState">No publications match your search.</div>

  </div>
</main>

<footer>
  <span>© Ludovico Papalia</span>
  <a class="footer-back" href="/index.html">← Back to home</a>
</footer>

<!-- ═══════════════════════════════════════════════════════════════════════ -->

<!--  ████  EDIT ZONE — aggiungi/rimuovi pubblicazioni qui sotto  ████       -->
<!--                                                                         -->
<!--  Ogni voce è un oggetto JS con i seguenti campi:                        -->
<!--    year    : string  — anno di pubblicazione                            -->
<!--    title   : string  — titolo completo                                   -->
<!--    venue   : string  — rivista / conferenza / editore                   -->
<!--    desc    : string  — una o due righe di descrizione (può essere "")   -->
<!--    type    : string  — etichetta del badge (Conference / Journal /       -->
<!--                        Book Chapter / Book / Workshop / Talk …)         -->
<!--    href    : string  — path alla pagina HTML del paper                  -->
<!--                        Lascia "" se la pagina non esiste ancora.        -->
<!--                                                                         -->
<!--  L'ordine qui è l'ordine di visualizzazione (dal più recente).         -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<script>
var PAPERS = [
  {
    year:  "2025",

    type:  "Conference",

  },
  {
    year:  "2025",
    title: "BRAIN 2026 Workshop Paper",
    venue: "Blockchain Research & Applications for Innovative Networks",
    desc:  "Workshop contribution on the application of distributed ledger systems to parliamentary process tracking and normative complexity reduction.",
    type:  "Workshop",
    href:  "/papers/BRAIN_2026_Workshop_Paper.html"
  },
  {

    type:  "Journal",

  {

    desc:  "Conference paper on DLT-based architectures for digital government, with a focus on parliamentary transparency and open legislation.",
    type:  "Conference",
    href:  "/papers/ICEDEG_2025_Digital_Government_Blockchain.html"
  },
  {

    title: "Superbonus Edilizi: Disciplina Giuridica e Questioni Conteziose",
    venue: "Maggioli Editore — Collective volume, chapter author",
    desc:  "Book chapter analysing the legal framework and contentious aspects of the Italian Superbonus tax incentive scheme.",
    type:  "Book Chapter",
    href:  "/papers/Superbonus_Edilizi_Disciplina_Giuridica_e_Questioni_Conteziose.html"
  },
  {
    year:  "2024",
    title: "Diritto all'Oblio e Rimozione dei Contenuti Lesivi — Manuale d'Uso e Analisi Giuridica",
    venue: "Revised edition including blockchain and AI",
    desc:  "Updated edition of the manual on the right to be forgotten and harmful content removal, expanded with analysis of blockchain immutability challenges and AI moderation.",
    type:  "Book",
    href:  ""
  },
  {
    year:  "2022",
    title: "The Bias of Artificial Intelligence within the Justice Field",
    venue: "AIxHMI 2022 · CEUR-WS Vol. 3368",
    desc:  "Analysis of algorithmic bias in judicial and law enforcement contexts; proposes transparency and auditability requirements operable within the EU AI Act framework.",
    type:  "Conference",
    href:  "/papers/The_Bias_of_Artificial_Intelligence_within_the_Justice_Field.html"
  },
  {
    year:  "2020",
    title: "Odio Online: Tra Criminologia e Diritto",
    venue: "ISBN 979-8567192726 · Amazon top-3 Privacy & Security",
    desc:  "Monograph on the criminal repression of online hate speech, combining criminological analysis with a comparative legal framework.",
    type:  "Book",
    href:  "/papers/Odio_Online_Tra_Criminologia_e_Diritto.html"

/* ─── DOM refs ────────────────────────────────────────────────────────── */
var searchInput  = document.getElementById("searchInput");
var searchClear  = document.getElementById("searchClear");
var pubList      = document.getElementById("pubList");
var emptyState   = document.getElementById("emptyState");
var resultsCount = document.getElementById("resultsCount");

/* Escape special regex characters so the user can type freely */
function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

/* Wrap matched substring in <mark> for inline highlighting */
function highlight(text, query) {
  if (!query) return text;
  var re = new RegExp('(' + escapeRegex(query) + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function renderList(query) {
  query = (query || "").trim();
  var q = query.toLowerCase();

  var matched = PAPERS.filter(function(p) {
    if (!q) return true;
    return (
      p.title.toLowerCase().indexOf(q) !== -1 ||
      p.venue.toLowerCase().indexOf(q) !== -1 ||
      p.desc.toLowerCase().indexOf(q)  !== -1 ||
      p.year.toLowerCase().indexOf(q)  !== -1 ||
      p.type.toLowerCase().indexOf(q)  !== -1
    );
  });

  pubList.innerHTML = "";
  emptyState.style.display = matched.length === 0 ? "block" : "none";

  resultsCount.textContent = q
    ? matched.length + " result" + (matched.length !== 1 ? "s" : "")
    : PAPERS.length + " publication" + (PAPERS.length !== 1 ? "s" : "");

  matched.forEach(function(p) {
    var el = document.createElement(p.href ? "a" : "div");
    el.className = "pub-item";
    if (p.href) el.href = p.href;

    var badge = document.createElement("span");
    badge.className = "pub-year-badge";
    badge.textContent = p.year;

    var body = document.createElement("div");
    body.className = "pub-body";

    var title = document.createElement("div");
    title.className = "pub-title";
    title.innerHTML = highlight(p.title, query);

    var venue = document.createElement("div");
    venue.className = "pub-venue";
    venue.innerHTML = highlight(p.venue, query);

    body.appendChild(title);
    body.appendChild(venue);

    if (p.desc) {
      var desc = document.createElement("div");
      desc.className = "pub-desc";
      desc.innerHTML = highlight(p.desc, query);
      body.appendChild(desc);
    }

    var typeBadge = document.createElement("span");
    typeBadge.className = "pub-type";
    typeBadge.textContent = p.type;

    el.appendChild(badge);
    el.appendChild(body);
    el.appendChild(typeBadge);
    pubList.appendChild(el);
  });
}

/* Initial render */
renderList("");

/* Live search */
searchInput.addEventListener("input", function() {
  var q = searchInput.value;
  searchClear.classList.toggle("visible", q.length > 0);
  renderList(q);
});

/* Clear button */
searchClear.addEventListener("click", function() {
  searchInput.value = "";
  searchClear.classList.remove("visible");
  searchInput.focus();
  renderList("");
});
</script>

</body>
</html>
