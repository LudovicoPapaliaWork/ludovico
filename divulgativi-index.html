/* ─── DOM refs ────────────────────────────────────────────────────────── */
var searchInput  = document.getElementById("searchInput");
var searchClear  = document.getElementById("searchClear");
var articleList  = document.getElementById("articleList");
var emptyState   = document.getElementById("emptyState");
var resultsCount = document.getElementById("resultsCount");

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlight(text, query) {
  if (!query) return text;
  var re = new RegExp('(' + escapeRegex(query) + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function renderList(query) {
  query = (query || "").trim();
  var q = query.toLowerCase();

  var matched = ARTICLES.filter(function(a) {
    if (!q) return true;
    return (
      a.title.toLowerCase().indexOf(q) !== -1 ||
      a.topic.toLowerCase().indexOf(q) !== -1 ||
      a.desc.toLowerCase().indexOf(q)  !== -1 ||
      a.date.toLowerCase().indexOf(q)  !== -1 ||
      a.tag.toLowerCase().indexOf(q)   !== -1
    );
  });

  articleList.innerHTML = "";
  emptyState.style.display = matched.length === 0 ? "block" : "none";

  resultsCount.textContent = q
    ? matched.length + " risultat" + (matched.length !== 1 ? "i" : "o")
    : ARTICLES.length + " articol" + (ARTICLES.length !== 1 ? "i" : "o");

  matched.forEach(function(a) {
    var el = document.createElement(a.href ? "a" : "div");
    el.className = "pub-item";
    if (a.href) el.href = a.href;

    var badge = document.createElement("span");
    badge.className = "pub-date-badge";
    badge.textContent = a.date;

    var body = document.createElement("div");
    body.className = "pub-body";

    var title = document.createElement("div");
    title.className = "pub-title";
    title.innerHTML = highlight(a.title, query);

    var topic = document.createElement("div");
    topic.className = "pub-topic";
    topic.innerHTML = highlight(a.topic, query);

    body.appendChild(title);
    body.appendChild(topic);

    if (a.desc) {
      var desc = document.createElement("div");
      desc.className = "pub-desc";
      desc.innerHTML = highlight(a.desc, query);
      body.appendChild(desc);
    }

    var tagBadge = document.createElement("span");
    tagBadge.className = "pub-type";
    tagBadge.textContent = a.tag;

    el.appendChild(badge);
    el.appendChild(body);
    el.appendChild(tagBadge);
    articleList.appendChild(el);
  });
}

renderList("");

searchInput.addEventListener("input", function() {
  var q = searchInput.value;
  searchClear.classList.toggle("visible", q.length > 0);
  renderList(q);
});

searchClear.addEventListener("click", function() {
  searchInput.value = "";
  searchClear.classList.remove("visible");
  searchInput.focus();
  renderList("");
});
</script>
